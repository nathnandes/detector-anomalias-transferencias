[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detector-anomalias-transferencias"
version = "0.1.0"
description = "Deteccao nao supervisionada de anomalias em transferencias entre empresas, com o motivo em texto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/detector_anomalias"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["detector_anomalias"]
strict = true

[[tool.mypy.overrides]]
# scikit-learn nao publica tipos.
module = ["sklearn.*"]
ignore_missing_imports = true
